<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not Found · Rising Tigers Initiative</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17111F">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17111F;--bone:#EFE8DC;
  --candle:#F2FF00;--marigold:#F5851F;--rosa:#E8117F;--verde:#C8F0A0;--morado:#7B4FCF;
  --muted:rgba(239,232,220,.76);--hair:rgba(239,232,220,.16);
  --disp:'Instrument Serif',ui-serif,Georgia,serif;
  --body:'Public Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:var(--night);color:var(--bone);font:400 1.0625rem/1.6 var(--body);
  padding:2rem clamp(1.25rem,5vw,3.5rem);position:relative;overflow:hidden;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 42% at 50% 30%,rgba(123,79,207,.22),transparent 72%);
}
.frame{
  position:relative;z-index:1;width:min(80vw,220px);aspect-ratio:1/1;
  margin-bottom:1.75rem;border:1.5px solid var(--hair);border-radius:4px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:rgba(239,232,220,.03);
}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .placeholder{
  font:400 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.label{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:.45rem;
  font:400 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  margin-bottom:1.1rem;
}
.label i{width:6px;height:6px;border-radius:50%;background:var(--rosa);box-shadow:0 0 .6rem var(--rosa)}
h1{
  position:relative;z-index:1;
  font:400 clamp(2.1rem,6vw,3.2rem)/1.08 var(--disp);letter-spacing:-.01em;
  max-width:20ch;margin-bottom:.85rem;
}
h1 em{font-style:italic;color:var(--candle)}
p{position:relative;z-index:1;max-width:38ch;color:var(--muted);margin-bottom:1.75rem}
.btn{
  position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;padding:.65rem 1.35rem;border:1.5px solid var(--marigold);border-radius:2px;
  background:var(--marigold);color:var(--night);font-weight:600;text-decoration:none;
}
.btn:hover{background:#FF9A3D;border-color:#FF9A3D}
</style>
</head>
<body>

  <div class="frame">
    <!-- swap this for <img src="/assets/404-art.svg" alt="..."> when you have the piece -->
    <span class="placeholder">[ image ]</span>
  </div>

  <p class="label"><i></i></p>

  <h1>Sorry! We've run into an error but there's absolutely <em>no need to panic.</em></h1>

  <p>The page you're looking for might not exist/hasn't been published yet. If you believe there's a more serious issue, please let us know at therisingtigersinitiative@gmail.com</p>

  <a class="btn" href="/">← Back to the hub</a>

</body>
</html>
